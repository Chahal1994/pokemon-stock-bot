name: Pokémon Stock Monitor

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Get repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # --------------------------------------------------
      # Run Pokémon stock monitor
      # --------------------------------------------------

      - name: Run stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pokemon_monitor.py


      # --------------------------------------------------
      # Save stock state
      # --------------------------------------------------

      - name: Save stock state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json

          if git diff --cached --quiet; then
            echo "No stock state changes."
          else
            git commit -m "Update Pokémon stock state"
            git push
          fi